AWSTemplateFormatVersion: "2010-09-09"
Description: S3 bucket vasanthtest (name includes account ID for global uniqueness)

Resources:
  VasanthTestBucket:
    Type: AWS::S3::Bucket
    Properties:
      # S3 bucket names are globally unique; account ID ensures no conflict
      BucketName: !Sub "vasanthtest-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  BucketName:
    Description: Name of the S3 bucket
    Value: !Ref VasanthTestBucket
  BucketArn:
    Description: ARN of the S3 bucket
    Value: !GetAtt VasanthTestBucket.Arn
