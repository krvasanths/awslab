AWSTemplateFormatVersion: "2010-09-09"
Description: API Gateway REST API with a Lambda function (GET /hello)

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name.

Resources:
  # Lambda execution role (for CloudWatch Logs)
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda function (inline Python handler)
  HelloFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "awslab-hello-${AWS::StackName}"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          def handler(event, context):
              return {
                  'statusCode': 200,
                  'headers': {'Content-Type': 'application/json'},
                  'body': '{"message": "Hello from Lambda"}'
              }

  # Allow API Gateway to invoke the Lambda
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HelloFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*"
        - ApiId: !Ref Api

  # REST API
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "awslab-api-${AWS::StackName}"
      Description: API Gateway for awslab Lambda

  # Resource: /hello
  HelloResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: hello

  # Method: GET /hello -> Lambda
  HelloMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref HelloResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HelloFunction.Arn}/invocations"

  # Deployment and stage
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: HelloMethod
    Properties:
      RestApiId: !Ref Api
      Description: Deployment for !Ref StageName

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref StageName

Outputs:
  ApiEndpoint:
    Description: Invoke URL for GET /hello
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/hello"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"
  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref HelloFunction
  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt HelloFunction.Arn
